name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Clean old gradle.properties
      run: |
        # حذف أي ملفات gradle.properties قديمة
        find . -name "gradle.properties" -delete
        # إنشاء ملف جديد
        echo "org.gradle.jvmargs=-Xmx2048m -Xms512m" > gradle.properties
        echo "org.gradle.parallel=true" >> gradle.properties
        echo "org.gradle.caching=true" >> gradle.properties
        echo "org.gradle.daemon=false" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "==================== gradle.properties ===================="
        cat gradle.properties
        echo "=========================================================="
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Release APK
      env:
        JAVA_OPTS: "-Xmx2048m -Xms512m"
        GRADLE_OPTS: "-Xmx2048m -Xms512m"
      run: |
        # استخدام متغيرات البيئة لتجاوز أي إعدادات
        export JAVA_OPTS="-Xmx2048m -Xms512m"
        export GRADLE_OPTS="-Xmx2048m -Xms512m"
        ./gradlew assembleRelease --no-daemon \
          -Dorg.gradle.jvmargs="-Xmx2048m -Xms512m" \
          -Dorg.gradle.daemon=false \
          --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
